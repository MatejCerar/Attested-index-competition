name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install deps
        run: |
          npm install
          git clone --depth 1 https://github.com/foundry-rs/forge-std lib/forge-std
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check
      - run: forge test -vv
