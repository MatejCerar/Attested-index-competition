# Index definition. Versioned: bump `version` whenever anything here changes.
# Same config + same frozen feature matrix => byte-identical index.
# v3: real factor feature set (value, quality, growth, momentum, low-vol,
#     yield + AI-scored qualitative factors). Absolute weights sum to 1.00.
version: 3

# Scoring features and their SIGNED weights.
#   positive => higher raw value is better
#   negative => lower is better (valuation multiples, leverage, volatility,
#               regulatory risk, controversies)
# Only NUMERIC and SCORE features belong here. LABEL features (sector,
# market_cap_tier, competitive_position) drive eligibility/caps, not the score.
weights:
  # value
  pe_forward: -0.04
  ev_ebitda: -0.04
  fcf_yield: 0.08
  # yield
  dividend_yield: 0.02
  # growth
  revenue_growth_yoy: 0.10
  # quality / profitability
  gross_margin: 0.04
  return_on_equity: 0.10
  net_debt_to_ebitda: -0.08
  # momentum + low volatility
  momentum_12m: 0.10
  volatility_90d: -0.06
  # AI-scored qualitative factors
  moat_strength: 0.10
  management_quality: 0.05
  ai_exposure: 0.06
  demand_durability: 0.05
  regulatory_risk: -0.05
  esg_controversy: -0.03

normalization: zscore        # zscore | rank | minmax
winsor: 0.05                 # clip each feature to [5th, 95th] pct before norm
weighting: score_tilt        # equal | score_tilt

top_n: 20
max_weight: 0.10             # per-name cap
sector_cap: 0.30             # per-sector cap (uses the `sector` GICS label)

# Eligibility filters (leave eligible_sectors empty to allow all).
eligible_sectors: []
min_market_cap_usd: 50000000000

# Column names in the feature matrix.
id_col: ticker
sector_col: sector
market_cap_col: market_cap_usd
