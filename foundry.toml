[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib", "node_modules"]
solc = "0.8.25"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 80
tab_width = 4
bracket_spacing = false
quote_style = "double"

[rpc_endpoints]
coston2 = "https://coston2-api.flare.network/ext/C/rpc"
